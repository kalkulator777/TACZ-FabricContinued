plugins {
    /* 1.17 起 Loom 拆成了两个插件：`fabric-loom` 产出 Mojmap 命名的 jar，
     * `fabric-loom-remap` 保留原来重映射到 intermediary 的行为。1.21.11 要的是后者。 */
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${archives_base_name}-${minecraft_version}"
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

sourceSets {
    // Loom 把重映射后的 Minecraft 挂在 main 上，测试要用得自己接过来
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

loom {
    accessWidenerPath = file("src/main/resources/tacz.accesswidener")
    mixin {
        defaultRefmapName = "tacz.refmap.json"
    }
    runs {
        client {
            // 加 -PquickPlay=<存档名> 就能跳过主菜单直接进存档，省去手点，方便反复验证渲染
            if (project.hasProperty("quickPlay")) {
                programArgs("--quickPlaySingleplayer", project.property("quickPlay").toString())
            }
            /* -PquickJoin=<地址> 直接连服务端。这个环境里没有鼠标，单机世界建不出来，
             * 所以要进世界只能连本地服务端，见上面 server 的 runDir 注释。*/
            if (project.hasProperty("quickJoin")) {
                programArgs("--quickPlayMultiplayer", project.property("quickJoin").toString())
            }
            /* -PclientProps=a=1,b=2 把系统属性透给客户端 JVM。诊断开关（比如
             * tacz.scopeDebug）是给运行中的客户端看的，不是给 Gradle 看的，-D 到不了那儿。*/
            if (project.hasProperty("clientProps")) {
                project.property("clientProps").toString().split(",").each {
                    def kv = it.split("=", 2)
                    property kv[0], kv.length > 1 ? kv[1] : "true"
                }
            }
        }
        datagen {
            property "fabric-api.datagen.modid", "tacz"
        }
        /* 服务端单独一个工作目录。渲染问题要在世界里看，而这个环境里没法用鼠标建世界，
         * 所以走「起个本地服务端，客户端 --quickPlayMultiplayer 连上去」这条路，
         * 两个进程同时跑，共用 run/ 会互相踩。*/
        server {
            runDir = "run/server"
        }
    }
}

repositories {
    maven {
        // 阿里云镜像，方便国内开发
        url = uri("https://maven.aliyun.com/repository/public/")
        content {
            includeGroup 'org.apache.commons'
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "Mod Maven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url = "https://maven.shedaniel.me/" } // cloth config api
    maven { url = "https://dvs1.progwml6.com/files/maven/" }
    maven { url = "https://modmaven.dev" }
    maven {
        name = 'tterrag maven'
        url = 'https://maven.tterrag.com/'
    }
    maven {
        // Shedaniel's maven (Architectury API)
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        // latvian.dev Maven (KubeJS and Rhino)
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
            includeGroup "com.github.FiguraMC.luaj"
        }
    }
    maven {// Player Animation Library，PlayerAnimator 作者自己推荐的后继者
        name = "RedLance"
        url = 'https://repo.redlance.org/public'
    }
    maven {// CCA
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {// Forge Config API Port
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {// ModMenu
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "devOSSnapshots"
        url = uri("https://mvn.devos.one/snapshots")
    }
    mavenCentral()
    // 这里原本还有 mavenLocal()。它会让构建结果取决于开发者本机 ~/.m2 里恰好躺着什么，
    // 同一个提交在两台机器上可以编译出不同的东西。所有依赖都能从上面的仓库解析到。
    // libs/ 的 flatDir 随 SimpleBedrockModel 一起去掉了，那是最后一个本地 jar。
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    /* Mojmap，不是 Yarn。Parchment 这一层去掉了：它对 1.21.11 没有发布，
     * 少的只是参数名和 javadoc。26.1 完全不混淆之后这里会再简化一次。*/
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    annotationProcessor 'com.google.code.findbugs:jsr305:3.0.2'


    // Apache Commons Math 库，用于进行一些插值运算
    implementation(include('org.apache.commons:commons-math3:3.6.1'))

    // LuaJ 库，将 lua 脚本语言引入用于控制枪械的逻辑和动画状态机
    implementation(include('com.github.FiguraMC.luaj:luaj-core:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('com.github.FiguraMC.luaj:luaj-jse:3.0.8-figura')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation(include('org.apache.bcel:bcel:6.6.1')) {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }

    // compile against the JEI API but do not include it at runtime
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    // at runtime, use the full JEI jar for Fabric
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    // 手柄按键支持。MrCrayfish 的这两个只有 CurseForge 发布，所以只能钉在文件 id 上
    modCompileOnly "curse.maven:framework-549225:${framework_file_id}"
    modCompileOnly("curse.maven:controllable-317269:${controllable_file_id}")

    // 越肩视角，用来兼容第三人称准星
    modImplementation "maven.modrinth:shoulder-surfing-reloaded:${shoulder_surfing_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_fabric}"

    /* 编译只需要 Iris —— 我们的代码里没有一处引用 Sodium，Embeddium 是 Forge 侧的 Sodium，
     * Oculus 是 Forge 侧的 Iris，在 Fabric 上都不存在。
     *
     * 运行时只放 Sodium：当前 Sodium 0.8.13 声明 `breaks iris <=1.10.7`，而 1.10.7 就是
     * Iris 面向 1.21.11 的最新版本，两个最新版在上游本身就互斥，一起塞进开发环境会直接拦在
     * 模组解析阶段。等 Iris 发出兼容版本后再把 modRuntimeOnly 加回来，届时着色器兼容代码
     * （com.tacz.guns.compat.iris）才能在开发环境里真正跑到。*/
    modCompileOnly "maven.modrinth:iris:${iris_version}"
    /* 加 -Pshaders 就把 Iris 也放进运行时，用来复现和验证光影下的渲染问题。
     * 代价是 Sodium 要退回 0.8.7：0.8.13 声明 breaks iris <=1.10.7，而 1.10.7 是 Iris 面向
     * 1.21.11 的最新版；0.8.7 只 breaks iris <=1.10.5，所以这一对能一起加载。默认不带这个
     * 属性时运行时仍然只有最新的 Sodium，和以前一样。*/
    if (project.hasProperty("shaders")) {
        modRuntimeOnly "maven.modrinth:iris:${iris_version}"
        modRuntimeOnly "maven.modrinth:sodium:${sodium_shaders_version}"
        /* Iris 把 jcpp、glsl-transformer、antlr 三个库嵌在自己的 jar 里（META-INF/jars）。
         * 开发环境不会把嵌套 jar 摊开，于是加载着色器包时 NoClassDefFoundError:
         * org/anarres/cpp/LexerException。按坐标单独加一遍，版本对着 iris jar 里的文件名。*/
        runtimeOnly "org.anarres:jcpp:1.4.14"
        runtimeOnly "io.github.douira:glsl-transformer:3.0.0-pre3"
        runtimeOnly "org.antlr:antlr4-runtime:4.13.1"
    } else {
        modRuntimeOnly "maven.modrinth:sodium:${sodium_version}"
    }

    /* Carry On 在 Modrinth 上一个版本条目同时挂着三个加载器的文件，maven 无法区分，
     * 按坐标取到的是 NeoForge 那个 jar，所以这里还是钉在 CurseForge 的文件 id 上 */
    modCompileOnly "curse.maven:carry-on-274259:${carry_on_file_id}"

    modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${player_animation_lib}"

    // kjs暂无Fabric1.21
    // kubejs开发环境引入
    // modCompileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
    // modCompileOnly "dev.latvian.mods:rhino-fabric:${rhino_version}"

    // For REI
    modCompileOnly "dev.architectury:architectury-fabric:${architectury_version}"

    // CCA
    modImplementation(include("org.ladysnake.cardinal-components-api:cardinal-components-base:7.3.2"))
    modImplementation(include("org.ladysnake.cardinal-components-api:cardinal-components-entity:7.3.2"))

    // MKB
    // 1.21存在不能单独设置alt, ctrl, shift的bug，暂时弃用
    // modImplementation(include("curse.maven:modern-keybinding-fabric-695433:6016136"))

    // Forge Config API Port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.11.1"

    // ModMenu
    modImplementation("com.terraformersmc:modmenu:17.0.0")

    // Zoomify
    modCompileOnly "maven.modrinth:zoomify:2.15.2+1.21.11"

    /* ImmediatelyFast 只留运行时：它的 hud_batching 已经没有了，我们那段兼容也随之删掉，
     * 编译期不再需要它，但开发环境里还是想带着它一起跑一跑。
     *
     * 带 -Pshaders 时它必须摘掉：它的 IrisCompat 一见到 Iris 就去用 net.lenni0451.reflect，
     * 那是它 jar 里嵌套的库，开发环境不会把嵌套 jar 摊到 classpath 上，于是
     * RenderSystem.initRenderer 里直接 NoClassDefFoundError，客户端起不来。
     * 这是开发环境的打包问题，不是我们的兼容问题。*/
    if (!project.hasProperty("shaders")) {
        modRuntimeOnly "maven.modrinth:immediatelyfast:1.14.3+1.21.11-fabric"
    }

    modRuntimeOnly "maven.modrinth:tweakeroo:0.27.11"
    modRuntimeOnly "maven.modrinth:malilib:0.27.16"

    // REI
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:$rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:$rei_version"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:$rei_version"

    /* 只在开发环境里跑的几个便利 mod 暂时摘掉，代码一处也没引用它们：
     * Flashback 连着 lattice 和 mixinconstraints 三个坐标，假人 Selene / mmmmmmmmmmmm
     * 和全键无冲只发布在 CurseForge、只能钉文件 id。移植期间它们除了让「哪里坏了」
     * 更难回答之外没有别的作用，等游戏能跑起来再按目标版本装回去。*/

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

processResources {
    /* 这几个值要在配置阶段就取出来。filesMatching 的闭包是在执行阶段跑的，
     * 在那里访问 project 会挡住配置缓存，Gradle 10 起直接报错。*/
    def modVersion = project.version.toString()
    def minecraftVersion = project.minecraft_version.toString()
    def loaderVersion = project.loader_version.toString()

    inputs.property "version", modVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    // 移植期间要一次看到全部错误，javac 默认只报 100 个就停
    it.options.compilerArgs << "-Xmaxerrs" << "100000"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }

    repositories {
        /* 发布目标来自 -Ppublish_repo=<url 或路径>，或者环境变量 TACZ_PUBLISH_REPO，
         * 都没有就发到 build/repo。这里原来硬编码着上游作者机器上的一个 Windows 路径，
         * 别人执行 publish 就是往一个不存在的盘写东西。*/
        def publishRepo = project.findProperty("publish_repo") ?: System.getenv("TACZ_PUBLISH_REPO")
        maven {
            name = "publishTarget"
            url = publishRepo != null ? uri(publishRepo) : layout.buildDirectory.dir("repo").get().asFile.toURI()
        }
    }
}
